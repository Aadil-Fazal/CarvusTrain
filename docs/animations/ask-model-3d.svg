<svg xmlns="http://www.w3.org/2000/svg" width="880" height="184" viewBox="0 0 880 184" role="img" aria-labelledby="title details">
  <title id="title">Ask a model</title>
  <desc id="details">A pink speech bubble bobs above a lilac model while three mint dots pulse.</desc>
  <style>
    .bubble { animation: float 3s ease-in-out infinite; }
    .dot { animation: blink 1.8s ease-in-out infinite; }
    .dot-two { animation-delay: .18s; }
    .dot-three { animation-delay: .36s; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-10px); } }
    @keyframes blink { 0%, 100% { opacity: .45; } 35%, 57% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bubble, .dot { animation: none; } }
  </style>
  <rect x="1" y="1" width="878" height="182" rx="23" fill="#191631" stroke="#4e477b" stroke-width="2"/>
  <ellipse cx="743" cy="152" rx="83" ry="14" fill="#100f27"/>
  <g stroke="#101027" stroke-width="3" stroke-linejoin="round">
    <path d="M671 94l23-20 114 3-19 21z" fill="#e6d0ff"/>
    <path d="M789 98l19-21v59l-19 20z" fill="#7853b3"/>
    <path d="M685 94h90q14 0 14 14v32q0 13-14 13h-90q-14 0-14-13v-32q0-14 14-14z" fill="#c6a8f5"/>
  </g>
  <rect x="692" y="108" width="76" height="29" rx="11" fill="#26264a"/>
  <circle cx="713" cy="122" r="4" fill="#a4ffee"/>
  <circle cx="747" cy="122" r="4" fill="#a4ffee"/>
  <g class="bubble">
    <path d="M739 30h92q13 0 13 13v25q0 13-13 13h-36l-17 13 3-13h-42q-13 0-13-13V43q0-13 13-13z" fill="#97528f" stroke="#101027" stroke-width="3"/>
    <path d="M733 24h92q13 0 13 13v25q0 13-13 13h-36l-17 13 3-13h-42q-13 0-13-13V37q0-13 13-13z" fill="#ffc4e9" stroke="#101027" stroke-width="3"/>
    <circle class="dot" cx="754" cy="50" r="5" fill="#694282"/>
    <circle class="dot dot-two" cx="779" cy="50" r="5" fill="#694282"/>
    <circle class="dot dot-three" cx="804" cy="50" r="5" fill="#694282"/>
  </g>
  <g font-family="Arial, sans-serif" font-weight="900" font-size="49" paint-order="stroke fill" stroke-linejoin="round">
    <text x="64" y="99" fill="#87519a" stroke="#0f1025" stroke-width="8">Ask a model!</text>
    <text x="58" y="92" fill="#ffc6ec" stroke="#111128" stroke-width="6">Ask a model!</text>
  </g>
  <text x="60" y="132" fill="#eee4ff" font-family="Arial, sans-serif" font-size="19">Question the base model or a checkpoint</text>
</svg>
