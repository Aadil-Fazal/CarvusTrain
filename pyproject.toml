[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "CarvusTrain"
version = "4.0.0"
description = "CarvusTrain: Multi-billion parameter AI training framework — Carvus Labs / Aadil Fazal"
readme = "README.md"
authors = [{ name = "Aadil Fazal", email = "aadilfazalb4u@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["ai", "deep-learning", "carvustrain", "carvus-labs", "aadil-fazal", "llm", "transformer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
coding = ["torch>=2.4", "transformers>=4.56,<6", "safetensors>=0.4", "psutil>=5.9"]
dev = ["pytest>=7.0", "build>=1.0", "twine>=4.0", "ruff>=0.1.0"]
all = ["numpy>=1.24", "pyyaml>=6.0", "scikit-learn>=1.0"]
llm = ["torch>=2.0"]

[project.scripts]
carvustrain = "carvustrain.cli:main"
carvus-train = "carvustrain.cli:main"
carvus = "carvustrain.cli:main"

[project.urls]
Homepage = "https://github.com/Aadil-Fazal/CarvusTrain"
Repository = "https://github.com/Aadil-Fazal/CarvusTrain.git"
Documentation = "https://github.com/Aadil-Fazal/CarvusTrain/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["packages/carvustrain/src"]
include = ["carvustrain", "carvustrain.*"]

[tool.setuptools.package-data]
carvustrain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 120
target-version = "py310"
