<svg xmlns="http://www.w3.org/2000/svg" width="880" height="172" viewBox="0 0 880 172" role="img" aria-labelledby="title detail">
  <title id="title">Keep your saved steps</title>
  <desc id="detail">A model and tokenizer at every recorded step.</desc>
  <defs>
    <linearGradient id="panel" x2="100%" y2="100%">
      <stop stop-color="#25203f"/>
      <stop offset="1" stop-color="#15142b"/>
    </linearGradient>
    <pattern id="grid" width="23" height="23" patternUnits="userSpaceOnUse">
      <circle cx="11.5" cy="11.5" r="1" fill="#a9dcff" opacity=".16"/>
    </pattern>
    <style>
      .object { animation: lift 3.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .spark { animation: shine 3.8s ease-in-out infinite; }
      @keyframes lift { 0%, 100% { transform: none; } 40% { transform: translateY(-9px); } 61% { transform: none; } }
      @keyframes shine { 0%, 100% { opacity: .3; } 36%, 52% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .object, .spark { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="878" height="170" rx="24" fill="url(#panel)" stroke="#514775" stroke-width="2"/>
  <rect x="12" y="12" width="856" height="148" rx="17" fill="url(#grid)"/>
  <ellipse cx="132" cy="143" rx="74" ry="10" fill="#0f1024"/>
  <g transform="translate(48 17)">
    <g class="object" stroke="#171530" stroke-width="3" stroke-linejoin="round">
      <g>
      <path d="M25 84l58-16 60 17-58 18z" fill="#d5ecff"/>
      <path d="M25 84l60 19v23l-60-19z" fill="#81b6e8"/>
      <path d="M85 103l58-18v23l-58 18z" fill="#4979aa"/>
      </g>
      <g transform="translate(0 -27)">
      <path d="M25 84l58-16 60 17-58 18z" fill="#d5ecff"/>
      <path d="M25 84l60 19v23l-60-19z" fill="#81b6e8"/>
      <path d="M85 103l58-18v23l-58 18z" fill="#4979aa"/>
      </g>
      <g transform="translate(0 -54)">
      <path d="M25 84l58-16 60 17-58 18z" fill="#d5ecff"/>
      <path d="M25 84l60 19v23l-60-19z" fill="#81b6e8"/>
      <path d="M85 103l58-18v23l-58 18z" fill="#4979aa"/>
      </g>
    </g>
  </g>
  <path class="spark" d="M191 36q2-9 8-10-6-1-8-10-2 9-8 10 6 1 8 10zM52 83q2-8 8-10-6-1-8-10-2 9-8 10 6 2 8 10z" fill="#a9dcff"/>
  <g font-family="Arial, sans-serif" font-size="40" font-weight="900" paint-order="stroke fill" stroke-linejoin="round">
    <text x="252" y="85" fill="#507ba7" stroke="#121127" stroke-width="6">Keep your saved steps</text>
    <text x="247" y="79" fill="#a9dcff" stroke="#121127" stroke-width="5">Keep your saved steps</text>
  </g>
  <text x="249" y="114" fill="#eee8ff" font-family="Arial, sans-serif" font-size="19">A model and tokenizer at every recorded step</text>
