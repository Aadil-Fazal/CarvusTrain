[metadata]
name = CarvusTrain
version = 4.0.0
author = Aadil Fazal
author_email = aadilfazalb4u@gmail.com
description = CarvusTrain: Multi-billion parameter AI training framework
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/Aadil-Fazal/CarvusTrain
license = MIT
license_file = LICENSE
platforms = any
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: Education
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = packages/carvustrain/src
include =
    carvustrain
    carvustrain.*

[options.entry_points]
console_scripts =
    carvustrain = carvustrain.cli:main
    carvus-train = carvustrain.cli:main
    carvus = carvustrain.cli:main
